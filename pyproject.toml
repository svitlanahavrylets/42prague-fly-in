[project]
name = "fly-in"
description = "A multi-agent pathfinding simulation to coordinate drone fleets."
version = "0.1.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "shavryle", email = "shavryle@student.42prague.com" },
]
dependencies = [
	"pydantic>=2.11.0",
	"numpy>=1.24.0",
	"colorama>=0.4.6",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
	"flake8>=6.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]